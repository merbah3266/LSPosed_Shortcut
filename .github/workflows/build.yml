name: Manual Android Build & Sign

on:
  workflow_dispatch:

jobs:
  build_and_sign:
    name: Build APK & Sign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Extract Version Name
        id: vars
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -n 1 | awk -F '["'\'']' '{print $2}')
          echo "VERSION_NAME=${VERSION_NAME:-unknown}" >> "$GITHUB_ENV"

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNATURE }}
          KEY_ALIAS: ${{ secrets.SIGNATURE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNATURE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNATURE_PASSWORD }}
        run: |
          rm -rf final_apks signing
          mkdir -p final_apks signing

          echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="final_apks/lsposed_shortcut_v${VERSION_NAME}_signed.apk"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f -p 4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks signing/release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          rm -f signing/release.jks

      - name: Verify Release Signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "final_apks/lsposed_shortcut_v${VERSION_NAME}_signed.apk"

      - name: Prepare Final Files
        run: |
          DEBUG_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEBUG_FILE" ]; then
            cp "$DEBUG_FILE" final_apks/temp-unsigned.apk
            zip -d final_apks/temp-unsigned.apk "META-INF/*" || true
            mv final_apks/temp-unsigned.apk \
              "final_apks/lsposed_shortcut_v${VERSION_NAME}_unsigned.apk"
          fi

      - name: Upload Final Bundle
        uses: actions/upload-artifact@v6
        with:
          name: lsposed_shortcut_v${{ env.VERSION_NAME }}_builds
          path: final_apks/*.apk
          if-no-files-found: error