apply plugin: 'com.android.application'

android {
    namespace "merbah3266.lsposed.start"
    compileSdkVersion 36

    defaultConfig {
        applicationId "merbah3266.lsposed.start"
        minSdkVersion 27
        targetSdkVersion 36
        versionCode 5
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}